name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 启动服务（全新数据库）
        run: |
          node server.js &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8642/api/rank > /dev/null && break
            sleep 0.5
          done

      - name: 运行 40 项 API 集成测试
        run: node tests/api-test.mjs

      - name: 语法检查前端脚本
        run: |
          node --check assets/js/app.js
          node --check assets/js/api.js
          node --check assets/js/data.js
